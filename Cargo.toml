[workspace]
members = ["crates/island-core", "crates/island-webhook", "crates/island-lyrics", "crates/island-hook", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Small and fast: the island must stay light.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# The app crate is mostly Slint's generated UI code: optimising it hard took ~5 min
# a build for no visible gain (the renderer, in the slint crates, stays at "s").
[profile.release.package.kanmuri]
opt-level = 1
