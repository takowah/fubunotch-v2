[workspace]
members = ["crates/island-core", "crates/island-webhook", "crates/island-lyrics", "crates/island-hook", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Small and fast: the island must stay light.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# The app crate is mostly Slint's generated UI code: optimising it hard took ~5 min
# a build for no visible gain (the renderer, in the slint crates, stays at "s").
[profile.release.package.fubunotch-v2]
opt-level = 1

# Debug builds without debug info: the target folder was 6-8 GB a checkout,
# mostly debug info of the windows and slint crates nobody steps through.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

# Day-to-day builds of the installed app (`cargo build --profile fast`): the
# libraries (Slint's renderer, windows, ...) optimised as release, built once and
# kept; the app crate itself unoptimised and incremental, so a one-line change
# rebuilds in about a minute instead of 6-8 (18 Nov 2026).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.fast.package.fubunotch-v2]
opt-level = 0
